<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove Player</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --track: #e2d9d3;
    --accent: #c2410c;
    --accent-fg: #ffffff;
    --card: #faf7f5;
    --border: #e7e2de;
    --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --track: #4a423e;
      --accent: #fb923c;
      --accent-fg: #1c1917;
      --card: #26211f;
      --border: #3a3532;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  body { padding: 2px; }

  /* 语音条：一行，所有元素同一条水平中线 */
  .pill { --pill-h: 64px; display: flex; align-items: center; gap: 10px; height: var(--pill-h); padding: 0 18px 0 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--pill-h) / 2); }
  .pet { flex: 0 0 auto; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .btn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 20px; height: 20px; display: block; }
  .btn svg.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn .spin { animation: spin .9s linear infinite; }
  .wave { flex: 1 1 auto; min-width: 0; height: 36px; display: flex; align-items: center; gap: 2px;
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  .wave:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 6px; }
  .wave i { flex: 1 1 0; min-width: 2px; max-width: 4px; border-radius: 2px; background: var(--track); }
  .wave i.on { background: var(--accent); }
  .time { flex: 0 0 auto; min-width: 34px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* 仅出错时出现 */
  .err { margin: 6px 12px 0; color: var(--err); font-size: 12px; word-break: break-word; }
  .err.hidden { display: none; }

  /* 无文字页脚：只有两个图标链接（文字放在 aria-label / tooltip / README） */
  .tools { display: flex; justify-content: flex-end; gap: 2px; margin: 2px 12px 0 0; }
  .tools a { width: 26px; height: 26px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; cursor: pointer; }
  .tools a:hover, .tools a:focus-visible { color: var(--accent); outline: none; }
  .tools svg { width: 14px; height: 14px; display: block; }
</style>
</head>
<body>
<div class="pill" id="pill">
  <canvas class="pet" id="pet" width="78" height="57" role="img" aria-label="Clawd"></canvas>
  <button class="btn" id="play" type="button" aria-label="播放" disabled>
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
    <svg id="icon-load" class="hidden spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
  </button>
  <div class="wave" id="wave" role="slider" aria-label="进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"></div>
  <span class="time" id="time">0:00</span>
</div>
<div class="err hidden" id="err" role="alert"></div>
<div class="tools" id="tools">
  <a id="link-pet" href="https://github.com/watersalt0305/operit-clawd" target="_blank" rel="noopener noreferrer" title="像素形象 Clawd 来自 operit-clawd（AGPL-3.0，非官方粉丝作品，形象归 Anthropic）" aria-label="像素形象 Clawd 来自 operit-clawd（AGPL-3.0，非官方粉丝作品，形象归 Anthropic）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
  </a>
  <a id="link-src" href="https://github.com/sue1231511/minimax" target="_blank" rel="noopener noreferrer" title="本服务源码（AGPL-3.0）" aria-label="本服务源码（AGPL-3.0）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7 3 12l5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></svg>
  </a>
</div>
<audio id="audio" preload="auto"></audio>

<script>
(function () {
  "use strict";

  var PROTOCOL_VERSION = "2026-01-26";
  // 通过聚合站(MCPHub)转发时，工具名会带上服务名前缀，所以两种写法都试。
  var FETCH_TOOL_CANDIDATES = ["fetch_player_audio", "minimax-fetch_player_audio", "minimax_fetch_player_audio"];

  var $ = function (id) { return document.getElementById(id); };
  var audio = $("audio"), playBtn = $("play"), errEl = $("err"), timeEl = $("time"), waveEl = $("wave");
  var iconPlay = $("icon-play"), iconPause = $("icon-pause"), iconLoad = $("icon-load");

  var nextId = 1;
  var pending = {};
  var loadedAudioId = null;
  var initialized = false;

  function log(where, err, extra) {
    try {
      console.error("[cove-player] " + where, err && (err.stack || err.message || err), extra || "");
    } catch (e) { /* 控制台不可用时无事可做 */ }
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* 错误信息：仅出错时显示一行；平时整条语音条没有文字 */
  function setError(text) {
    if (text) {
      errEl.textContent = text;
      errEl.classList.remove("hidden");
      setPet("error");
    } else {
      errEl.textContent = "";
      errEl.classList.add("hidden");
    }
  }

  /* 按钮三态：play / pause / loading */
  function setBtn(mode) {
    iconPlay.classList.toggle("hidden", mode !== "play");
    iconPause.classList.toggle("hidden", mode !== "pause");
    iconLoad.classList.toggle("hidden", mode !== "loading");
    playBtn.setAttribute("aria-label", mode === "pause" ? "暂停" : (mode === "loading" ? "加载中" : "播放"));
  }

  /* ---------- Clawd 像素形象（素材来自 watersalt0305/operit-clawd，AGPL-3.0） ---------- */

  var FRAME = 32;            // 源图每帧 32x32
  // 画布以"视觉重心"为准居中，而不是按包围盒居中：
  // 每个动作先算出所有帧里所有像素(身体权重 1，气泡/星星等配饰权重 0.6)的重心 cx,cy，
  // 绘制时把这个重心放在画布正中。这样气泡在右上、钳子举高、星星在两侧等动作，
  // 螃蟹本体会向相反方向让出位置，整体看起来左右上下均衡。
  var CAN_W = 26, CAN_H = 19;  // 画布大小(单位：源图像素)，足够容纳所有动作的所有帧
  var scale = 3;               // 每个源图像素放大成 scale 个屏幕像素(整数，保持像素清晰)
  var PET = {
    idle: { fps: 3.85, frames: 8, cx: 16.0, cy: 15.85, src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAAgCAYAAAD9qabkAAAAqklEQVR42u3ZywmFMBQEUPvIwrIsxVqtRnERcOEHQYhkzgFXgQx4hwvvOQwAAAAAAAAAAAAAQM+WeVrfPL3lm7/5K0BwAeTLj16A9eJSxsvQ41mv+ekF9P4tgOgFIL9d/n7/U3499/4bbZ6vN1Hr/PQCmL8FEF0A+fItwODfQApg/ubvTxD58n0GrRefBdyd9ZCvAOZvAQQXQL789HwAAAAAAAAAAAAA4Dc2ik7w2YGe5PcAAAAASUVORK5CYII=" },
    look: { fps: 3.33, frames: 8, cx: 16.0, cy: 15.45, src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAAgCAYAAAD9qabkAAAAmklEQVR42u3YQQqAIBBAUe/homN5lM7aaWwVuAkUMkvfg2jh4gcTQxQCAAAAAAAAAAAAADCzY0+55dLX15+nbwD6+hZAyjFut9HyrEe/tq3f7wUcOf+WZ9C3APQtAP23Pz2e/hTR19cf1zcAff2VF4CfIPr6+gagr7/yArgeorzXnunr6/+/bwD6+isvAAAAAAAAAAAAAADgK07HaRtIf6SrvQAAAABJRU5ErkJggg==" },
    talk: { fps: 4.55, frames: 4, cx: 17.49, cy: 13.87, src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAgCAYAAADaInAlAAAApElEQVR42u3WwQmEMBAFUPvwYFlbirXagCd7cBERgyiurBKcvAfBQyA/ZMaQqgIAgH8MQz+eDflx8xVAA8whdd1kPYAlf28fOfLTfUTO9we6ARSg+AbI/QiV/5Cu/YxXhvxY+QqgAeaFpxflUWg6Jz9WvgIk6+/tYTsXJv/q1XP3VSQ/b74ClN4AHkHyHYD8dRPp99c5+THyFaD0BgAAAAAA4I2+iDkiqYgvW6wAAAAASUVORK5CYII=" },
    happy: { fps: 9.09, frames: 6, cx: 16.0, cy: 13.24, src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAAAgCAYAAABEmHeFAAABHUlEQVR42u3ZUQqCQBQFUPfhR8tqKbWSvltV0D6i30JIGGQCddQZnXMgCixf6n1vpJoGAAAAAKr3vJw/3WOrz61R//24flxJJulD0wdp7mOpBkiprwFM4CoboDuG/jjC13taATXAxgGMhSbcX9ue/taKbUudwGNqbFl/6wGgATJdgGFowoDFgjbcNtzP1BAuVV8DHKwB5kzAJRrgdb+Nvujde1MCGGualPp7PP+7n8Rr1J87Afd4/LEVwPnPuPLk/gK5JmBJAXT+C2iAsUugAKp/pPxZAn/fIXweu+0I9au9BQuXtSlL4NInQgPU2QDZ81fSz2C5A1jCDxG1NWAx+TOBqfkWrPEHCLmbL3v+TGBqvgUEAAAAAAAAACjcF4vVXeqqhECLAAAAAElFTkSuQmCC" },
    error: { fps: 11.11, frames: 4, cx: 15.97, cy: 15.18, src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAAAgCAYAAADaInAlAAAAz0lEQVR42u3XwQ2CMBQGYPbg4DoOYOIoupqjmHD04AKeIRy4GINBKa+l35f0pCn/kz9FmgYAAGBVz9OxH1et10+l6x79uBSgwgJMN7+IEihA+gIUcxrgP4ATYGPX2+v/2e+Xc79kpRomKkcO8/+SYbz5qxWgbQ9fLzp9J2UBInLkMH9ohvfN5y68xQmwdY4c5g/N4ASo9ARY+tzJ5Rm8Vo4c5g/NoACVF8BbQNlvAc2efgAFCM4wbfpp87nP9pIjh/lDMyhA5QUAAAAAAKBUA/NS3/B2C/lCAAAAAElFTkSuQmCC" }
  };
  var petCv = $("pet"), petCtx = null, petImgs = {}, petState = null, petFrame = 0, petTimer = null;
  var reduceMotion = false;
  try { reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) { log("reduceMotion", e); }

  function petSize() {
    try {
      petCv.width = CAN_W * scale;
      petCv.height = CAN_H * scale;
      petCv.style.width = petCv.width + "px";
      petCv.style.height = petCv.height + "px";
      petCtx = petCv.getContext("2d");
      petCtx.imageSmoothingEnabled = false;
    } catch (e) {
      log("petSize", e, scale);
    }
  }

  function petDraw() {
    try {
      var img = petImgs[petState], def = PET[petState];
      if (!petCtx || !img || !def || !img.complete || !img.naturalWidth) return;
      // 整帧绘制，使该动作的视觉重心落在画布中心；取整到屏幕像素，避免像素块发虚
      var dx = Math.round((CAN_W / 2 - def.cx) * scale), dy = Math.round((CAN_H / 2 - def.cy) * scale);
      petCtx.clearRect(0, 0, petCv.width, petCv.height);
      petCtx.drawImage(img, petFrame * FRAME, 0, FRAME, FRAME, dx, dy, FRAME * scale, FRAME * scale);
    } catch (e) {
      log("petDraw", e, petState + "#" + petFrame);
    }
  }

  function petTick() {
    try {
      var def = PET[petState];
      if (!def) return;
      petFrame = (petFrame + 1) % def.frames;
      petDraw();
      petTimer = setTimeout(petTick, 1000 / def.fps);
    } catch (e) {
      log("petTick", e, petState);
    }
  }

  function setPet(state) {
    try {
      if (!PET[state] || state === petState) return;
      petState = state;
      petFrame = 0;
      clearTimeout(petTimer);
      petDraw();
      if (!reduceMotion) petTimer = setTimeout(petTick, 1000 / PET[state].fps);
    } catch (e) {
      log("setPet", e, state);
    }
  }

  function initPet() {
    try {
      petSize();
      Object.keys(PET).forEach(function (k) {
        var img = new Image();
        img.onload = function () { if (petState === k) petDraw(); };
        img.onerror = function () { log("petImage", new Error("sprite load failed"), k); };
        img.src = PET[k].src;
        petImgs[k] = img;
      });
      setPet("idle");
    } catch (e) {
      log("initPet", e);
    }
  }

  /* ---------- 波形进度条 ---------- */

  var PEAK_N = 96;       // 峰值采样点数；实际显示的条数按宽度从中重采样
  var peaks = defaultPeaks();
  var bars = [];
  var barCount = 0;
  var playedUpTo = -1;

  // 音频未解码(或解码失败)时的占位波形：确定性的伪随机，不闪烁
  function defaultPeaks() {
    var out = [], seed = 7;
    for (var i = 0; i < PEAK_N; i++) {
      seed = (seed * 9301 + 49297) % 233280;
      var r = seed / 233280;
      out.push(0.22 + 0.5 * r * (0.55 + 0.45 * Math.sin(i / 5.5) * Math.sin(i / 5.5)));
    }
    return out;
  }

  // 窄屏时形象缩到 2 倍，语音条同步变矮；宽度够时用 3 倍
  function applyScale() {
    try {
      var want = document.documentElement.clientWidth < 360 ? 2 : 3;
      if (want === scale && petCv.width === CAN_W * scale) return;
      scale = want;
      document.getElementById("pill").style.setProperty("--pill-h", (CAN_H * scale + 7) + "px");
      petSize();
      petDraw();
    } catch (e) {
      log("applyScale", e, scale);
    }
  }

  function buildBars() {
    try {
      var w = waveEl.clientWidth || 120;
      var n = Math.max(12, Math.min(48, Math.floor(w / 5)));
      if (n === barCount && bars.length) return;
      barCount = n;
      waveEl.textContent = "";
      bars = [];
      for (var i = 0; i < n; i++) {
        var b = document.createElement("i");
        waveEl.appendChild(b);
        bars.push(b);
      }
      playedUpTo = -1;
      paintBars();
      updateProgress();
    } catch (e) {
      log("buildBars", e, waveEl.clientWidth);
    }
  }

  function paintBars() {
    try {
      var per = peaks.length / bars.length;
      for (var i = 0; i < bars.length; i++) {
        var from = Math.floor(i * per), to = Math.max(from + 1, Math.floor((i + 1) * per)), m = 0;
        for (var j = from; j < to && j < peaks.length; j++) if (peaks[j] > m) m = peaks[j];
        bars[i].style.height = Math.round(16 + 84 * Math.min(1, m)) + "%";
      }
    } catch (e) {
      log("paintBars", e, bars.length);
    }
  }

  function updateProgress() {
    try {
      var d = audio.duration, t = audio.currentTime;
      var ratio = d > 0 ? Math.min(1, t / d) : 0;
      var upTo = Math.floor(ratio * bars.length + 0.0001);
      if (upTo !== playedUpTo) {
        for (var i = 0; i < bars.length; i++) bars[i].classList.toggle("on", i < upTo);
        playedUpTo = upTo;
      }
      waveEl.setAttribute("aria-valuenow", String(Math.round(ratio * 100)));
      // 播放中显示剩余时间，其余时候显示总时长
      timeEl.textContent = d > 0 ? fmt(!audio.paused && t > 0 ? d - t : d) : "0:00";
    } catch (e) {
      log("updateProgress", e);
    }
  }

  // 解码音频得到真实波形；失败则保留占位波形，不影响播放
  function computePeaks(b64) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      var ac = new AC();
      var closeAc = function () { try { ac.close(); } catch (e) { log("computePeaks.close", e); } };
      ac.decodeAudioData(bytes.buffer, function (buf) {
        try {
          var ch = buf.getChannelData(0), step = Math.floor(ch.length / PEAK_N) || 1, out = [], max = 0;
          for (var p = 0; p < PEAK_N; p++) {
            var sum = 0, cnt = 0;
            for (var k = p * step; k < (p + 1) * step && k < ch.length; k += 8) { sum += ch[k] * ch[k]; cnt++; }
            var rms = cnt ? Math.sqrt(sum / cnt) : 0;
            out.push(rms);
            if (rms > max) max = rms;
          }
          if (max > 0) {
            peaks = out.map(function (v) { return Math.pow(v / max, 0.7); });
            paintBars();
          }
        } catch (e) {
          log("computePeaks.analyze", e, "len=" + len);
        }
        closeAc();
      }, function (e) {
        log("computePeaks.decode", e, "len=" + len);
        closeAc();
      });
    } catch (e) {
      log("computePeaks", e);
    }
  }

  /* 外链：优先让宿主在浏览器里打开(ui/open-link)，失败再回退到普通新窗口 */
  function bindLink(id) {
    var a = $(id);
    a.addEventListener("click", function (ev) {
      try {
        ev.preventDefault();
        var url = a.getAttribute("href");
        request("ui/open-link", { url: url }).catch(function (e) {
          log("open-link", e, url);
          try { window.open(url, "_blank", "noopener"); } catch (e2) { log("open-link.fallback", e2, url); }
        });
      } catch (e) {
        log("bindLink", e, id);
      }
    });
  }

  /* ---------- 与宿主(Claude)的 postMessage JSON-RPC ---------- */

  function send(msg) {
    try {
      window.parent.postMessage(msg, "*");
    } catch (e) {
      log("send", e, msg && msg.method);
    }
  }

  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      var timer = setTimeout(function () {
        delete pending[id];
        reject(new Error("宿主没有响应: " + method));
      }, 60000);
      pending[id] = { resolve: resolve, reject: reject, timer: timer };
      send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  function notify(method, params) {
    send({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function reportSize() {
    try {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      notify("ui/notifications/size-changed", { height: h });
    } catch (e) {
      log("reportSize", e);
    }
  }

  window.addEventListener("message", function (event) {
    try {
      if (event.source !== window.parent) return;
      var msg = event.data;
      if (!msg || msg.jsonrpc !== "2.0") return;

      if (msg.id !== undefined && msg.method === undefined) {
        var p = pending[msg.id];
        if (!p) return;
        clearTimeout(p.timer);
        delete pending[msg.id];
        if (msg.error) {
          p.reject(new Error(typeof msg.error === "string" ? msg.error : (msg.error.message || JSON.stringify(msg.error))));
        } else {
          p.resolve(msg.result);
        }
        return;
      }

      if (msg.method === "ui/notifications/tool-result") {
        onToolResult(msg.params || {});
      } else if (msg.method === "ui/notifications/host-context-changed") {
        applyHostContext(msg.params || {});
      } else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) {
        try { audio.pause(); } catch (e) { log("teardown.pause", e); }
        send({ jsonrpc: "2.0", id: msg.id, result: {} });
      } else if (msg.method === "ping" && msg.id !== undefined) {
        send({ jsonrpc: "2.0", id: msg.id, result: {} });
      }
    } catch (e) {
      log("message-handler", e, event && event.data);
    }
  });

  function applyHostContext(ctx) {
    try {
      var vars = ctx && ctx.styles && ctx.styles.variables;
      if (vars && typeof vars === "object") {
        var root = document.documentElement.style;
        var map = {
          "--color-background-primary": "--bg",
          "--color-text-primary": "--fg",
          "--color-text-secondary": "--muted",
          "--color-background-secondary": "--card",
          "--color-border-primary": "--border"
        };
        Object.keys(map).forEach(function (k) { if (vars[k]) root.setProperty(map[k], vars[k]); });
      }
      if (ctx && ctx.theme === "dark") document.documentElement.style.colorScheme = "dark";
      else if (ctx && ctx.theme === "light") document.documentElement.style.colorScheme = "light";
    } catch (e) {
      log("applyHostContext", e, ctx);
    }
  }

  /* ---------- 业务：取回音频并播放 ---------- */

  function extractAudioId(result) {
    var sc = result && result.structuredContent;
    if (sc && typeof sc.audio_id === "string") return sc.audio_id;
    var parts = (result && result.content) || [];
    for (var i = 0; i < parts.length; i++) {
      var t = parts[i] && parts[i].type === "text" ? parts[i].text : "";
      var m = /audioId:\s*([0-9a-fA-F-]{36})/.exec(t || "");
      if (m) return m[1];
    }
    return null;
  }

  function onToolResult(result) {
    try {
      if (result && result.isError) {
        setBtn("play");
        setError((result.content && result.content[0] && result.content[0].text) || "合成失败");
        return;
      }
      var id = extractAudioId(result);
      if (!id) {
        setBtn("play");
        setError("没有拿到音频编号");
        log("onToolResult", new Error("audioId not found"), JSON.stringify(result).slice(0, 300));
        return;
      }
      if (id === loadedAudioId) return;
      loadedAudioId = id;
      loadAudio(id);
    } catch (e) {
      log("onToolResult", e, result);
      setBtn("play");
      setError("解析结果出错: " + e.message);
    }
  }

  function callFetchTool(audioId) {
    var i = 0, lastErr = null;
    function attempt() {
      if (i >= FETCH_TOOL_CANDIDATES.length) {
        return Promise.reject(lastErr || new Error("取音频的工具不可用"));
      }
      var name = FETCH_TOOL_CANDIDATES[i++];
      return request("tools/call", { name: name, arguments: { audio_id: audioId } }).then(function (res) {
        if (res && res.isError) {
          var m = (res.content && res.content[0] && res.content[0].text) || "取音频失败";
          lastErr = new Error(m);
          // 工具存在但业务报错(如已过期)：不必再试别的名字
          if (/过期|不存在|expired|not found/i.test(m) && !/unknown tool|Unknown tool/i.test(m)) throw lastErr;
          return attempt();
        }
        return res;
      }, function (err) {
        lastErr = err;
        return attempt();
      });
    }
    return attempt();
  }

  function loadAudio(audioId) {
    setError("");
    setBtn("loading");
    setPet("look");
    playBtn.disabled = true;
    callFetchTool(audioId).then(function (res) {
      var text = res && res.content && res.content[0] && res.content[0].text;
      if (!text) throw new Error("音频数据为空");
      var data = JSON.parse(text);
      if (data.error) throw new Error(data.error);
      if (!data.audio_base64) throw new Error("响应里没有 audio_base64");
      audio.src = "data:" + (data.mime_type || "audio/mpeg") + ";base64," + data.audio_base64;
      audio.load();
      computePeaks(data.audio_base64);
      setBtn("play");
      playBtn.disabled = false;
      var p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(function (e) {
          // 浏览器拦截自动播放时，等用户点一下播放键即可
          log("autoplay", e);
          setPet("idle");
        });
      }
    }).catch(function (e) {
      log("loadAudio", e, audioId);
      setBtn("play");
      setError("取回音频失败: " + e.message);
    });
  }

  /* ---------- 播放控件 ---------- */

  playBtn.addEventListener("click", function () {
    try {
      if (audio.paused) {
        var p = audio.play();
        if (p && typeof p.catch === "function") p.catch(function (e) { log("play", e); setError("播放失败: " + e.message); });
      } else {
        audio.pause();
      }
    } catch (e) {
      log("playBtn.click", e);
    }
  });

  audio.addEventListener("play", function () { setBtn("pause"); setError(""); setPet("talk"); updateProgress(); });
  audio.addEventListener("pause", function () { setBtn("play"); setPet("idle"); updateProgress(); });
  audio.addEventListener("ended", function () { setBtn("play"); setPet("happy"); updateProgress(); });
  audio.addEventListener("error", function () {
    var code = audio.error ? audio.error.code : "?";
    log("audio.error", new Error("media error code " + code));
    setBtn("play");
    setError("音频无法播放 (错误码 " + code + ")");
  });
  audio.addEventListener("loadedmetadata", updateProgress);
  audio.addEventListener("durationchange", updateProgress);
  audio.addEventListener("timeupdate", updateProgress);

  function seekFromEvent(ev) {
    try {
      var rect = waveEl.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
      if (audio.duration > 0) { audio.currentTime = ratio * audio.duration; updateProgress(); }
    } catch (e) {
      log("seek", e);
    }
  }
  waveEl.addEventListener("pointerdown", function (ev) {
    try {
      seekFromEvent(ev);
      waveEl.setPointerCapture(ev.pointerId);
      var move = function (e2) { seekFromEvent(e2); };
      var up = function () {
        waveEl.removeEventListener("pointermove", move);
        waveEl.removeEventListener("pointerup", up);
        waveEl.removeEventListener("pointercancel", up);
      };
      waveEl.addEventListener("pointermove", move);
      waveEl.addEventListener("pointerup", up);
      waveEl.addEventListener("pointercancel", up);
    } catch (e) {
      log("wave.pointerdown", e);
    }
  });
  waveEl.addEventListener("keydown", function (ev) {
    try {
      if (ev.key === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
      else if (ev.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
      else if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); playBtn.click(); }
    } catch (e) { log("keydown", e); }
  });

  /* ---------- 启动握手 ---------- */

  initPet();
  applyScale();
  buildBars();
  bindLink("link-pet");
  bindLink("link-src");

  if (typeof ResizeObserver === "function") {
    new ResizeObserver(function () { applyScale(); buildBars(); if (initialized) reportSize(); }).observe(document.documentElement);
  }

  request("ui/initialize", {
    appInfo: { name: "cove-player", version: "1.1.0" },
    appCapabilities: {},
    protocolVersion: PROTOCOL_VERSION
  }).then(function (res) {
    initialized = true;
    applyHostContext((res && res.hostContext) || {});
    notify("ui/notifications/initialized", {});
    reportSize();
  }).catch(function (e) {
    log("initialize", e);
    setError("无法连接到宿主: " + e.message);
  });
})();
</script>
</body>
</html>
